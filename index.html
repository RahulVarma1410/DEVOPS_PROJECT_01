<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Simple Web App</h1>
  </header>

  <main>

    <!-- Welcome Card (initial view) -->
    <section class="card" id="welcomeCard">
      <h2>Welcome!</h2>
      <p>Idi naa first simple web application starter template.</p>
      <p>Ippudu HTML5 structure correct ga raayabadindi.</p>
      <button id="actionBtn">Click Me</button>
      <p id="output"></p>
    </section>

    <!-- Login Card (hidden until button click) -->
    <section class="card hidden" id="loginCard">
      <h2>Login</h2>
      <p>Kripaya mee username and password ivvandi.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p id="loginOutput"></p>
      <button id="backBtn" class="link">← Back</button>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 My Web App</p>
  </footer>

  <script src="script.js"></script>

  <!-- Thank You Note -->
  <div class="thankyou">
    <p>Thank you for using My Simple Web App!</p>
  </div>

</body>
</html>
